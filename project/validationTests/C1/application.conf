# =========================
#  DcSim scenario: C1
#  - 1 station
#  - 5 trains
# =========================

study {
  id = "C1"
  name = "C1"
  description = "matlab verification"
}

dcsim {

  simulationControl {
    tickDurationSec = 1.0
    simulationStart = "00:00:00"
    simulationEnd   = "00:10:00"   # justera efter C1-data
    simulationSpeed = "FAST"
  }

  export {
    csvEveryNthStep = 1
    exportResolution_s = 1
  }

track {
  stations = [
    { name = "A", position_rwy = "1 0+100" },
    { name = "B", position_rwy = "1 1+203" },
    { name = "C", position_rwy = "1 2+011" },
    { name = "D", position_rwy = "1 2+914" },
    { name = "E", position_rwy = "1 4+653" }
  ]

  kilometer_boards = [
    { section = "1", km = "0+000", length = 1203 },
    { section = "1", km = "1+203", length = 808 },
    { section = "1", km = "2+011", length = 903 },
    { section = "1", km = "2+914", length = 1739 },
    { section = "1", km = "4+653", length = 47 },
    { section = "1", km = "4+700", length = 0 }
  ]

  junctions = [
    { from_position_rwy = "1 4+700", to_position_rwy = "1 0+0" }
  ]
}

grid {
    u_nominal_V = 750
    u_min_V = 500
    u_cutoff_V = 600
    u_max_V = 900
    i_train_max_A = 6000
    p_train_max_W = 10000000
    p_allow_W = 3600000

nodes = [
  { node_id = "GND",    position_rwy = "1 0+100" },
  { node_id = "F1",     position_rwy = "1 0+000" },
  { node_id = "F2",     position_rwy = "1 1+200" },
  { node_id = "F3",     position_rwy = "1 2+300" },
  { node_id = "F4",     position_rwy = "1 3+500" },
  { node_id = "F5",     position_rwy = "1 4+700" },
  { node_id = "R1",     position_rwy = "1 0+000" },
  { node_id = "R2",     position_rwy = "1 1+200" },
  { node_id = "R3",     position_rwy = "1 2+300" },
  { node_id = "R4",     position_rwy = "1 3+500" },
  { node_id = "R5",     position_rwy = "1 4+700" },
  { node_id = "ANCHOR", position_rwy = "1 4+700" }
]

  lines = [
    { node_from_id = "F1", node_to_id = "F2", lengthM = 1300, resistance_ohm_per_m = 0.00003 },
    { node_from_id = "F2", node_to_id = "F3", lengthM = 1100, resistance_ohm_per_m = 0.00003 },
    { node_from_id = "F3", node_to_id = "F4", lengthM = 1200, resistance_ohm_per_m = 0.00003 },
    { node_from_id = "F4", node_to_id = "F5", lengthM = 1200, resistance_ohm_per_m = 0.00003 },

    { node_from_id = "R1", node_to_id = "R2", lengthM = 1300, resistance_ohm_per_m = 0.00003 },
    { node_from_id = "R2", node_to_id = "R3", lengthM = 1100, resistance_ohm_per_m = 0.00003 },
    { node_from_id = "R3", node_to_id = "R4", lengthM = 1200, resistance_ohm_per_m = 0.00003 },
    { node_from_id = "R4", node_to_id = "R5", lengthM = 1200, resistance_ohm_per_m = 0.00003 }
  ]

  power_installations = [
    { installation_id = "SS0", installation_type = "SUBSTATION", emf_V = 780.0, internal_resistance_ohm = 0.01, rectifier_type = "DIODE" },
    { installation_id = "SS1", installation_type = "SUBSTATION", emf_V = 780.0, internal_resistance_ohm = 0.01, rectifier_type = "DIODE" },
    { installation_id = "SS2", installation_type = "SUBSTATION", emf_V = 780.0, internal_resistance_ohm = 0.01, rectifier_type = "DIODE" },
    { installation_id = "SS3", installation_type = "SUBSTATION", emf_V = 780.0, internal_resistance_ohm = 0.01, rectifier_type = "DIODE" },
    { installation_id = "SS4", installation_type = "SUBSTATION", emf_V = 780.0, internal_resistance_ohm = 0.01, rectifier_type = "DIODE" }
  ]

  installation_connections = [
    { installation_id = "SS0", node_id = "F1", connection_type = "FEEDING" },
    { installation_id = "SS0", node_id = "R1", connection_type = "RETURN" },

    { installation_id = "SS1", node_id = "F2", connection_type = "FEEDING" },
    { installation_id = "SS1", node_id = "R2", connection_type = "RETURN" },

    { installation_id = "SS2", node_id = "F3", connection_type = "FEEDING" },
    { installation_id = "SS2", node_id = "R3", connection_type = "RETURN" },

    { installation_id = "SS3", node_id = "F4", connection_type = "FEEDING" },
    { installation_id = "SS3", node_id = "R4", connection_type = "RETURN" },

    { installation_id = "SS4", node_id = "F5", connection_type = "FEEDING" },
    { installation_id = "SS4", node_id = "R5", connection_type = "RETURN" }
  ]

  groundNodeId = "GND"
  anchorNodeId = "ANCHOR"
}

traffic {
  timetable {
    trains = [
      { id = "Train1", template_id = "T1", departure = "00:00:00", count = 1, sectionId = "1", trackId = "u"  },
      { id = "Train2", template_id = "T2", departure = "00:01:30", count = 1, sectionId = "1", trackId = "u"  },
      { id = "Train3", template_id = "T3", departure = "00:03:00", count = 1, sectionId = "1", trackId = "u"  },
      { id = "Train4", template_id = "T4", departure = "00:04:30", count = 1, sectionId = "1", trackId = "u"  }
    ]
  }

  templates = {
    T1 = {
      run_excel = "templates/t1_up_A-B.xlsx"
      motoring_and_auxiliaries_in_same_model = false
      auxiliary_power_W = 0

      stops = [
        { signature = "A", departure = "00:00:00" },
        { signature = "B", arrival   = "00:08:35" }
      ]
    }

    T2 = {
      run_excel = "templates/t1_down_A-B.xlsx"
      motoring_and_auxiliaries_in_same_model = false
      auxiliary_power_W = 0

      stops = [
        { signature = "A", departure = "00:00:00" },
        { signature = "B", arrival   = "00:08:35" }
      ]
    }

    T3 = {
      run_excel = "templates/t2_up_A-B.xlsx"
      motoring_and_auxiliaries_in_same_model = false
      auxiliary_power_W = 0

      stops = [
        { signature = "A", departure = "00:00:00" },
        { signature = "B", arrival   = "00:09:32" }
      ]
    }

    T4 = {
      run_excel = "templates/t1_down_A-B.xlsx"
      motoring_and_auxiliaries_in_same_model = false
      auxiliary_power_W = 0

      stops = [
        { signature = "A", departure = "00:00:00" },
        { signature = "B", arrival   = "00:09:31" }
      ]
    }
  }
}

}