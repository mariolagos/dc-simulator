# SS1 is relocated to J1 for this synthetic branch-station verification case.
# Its six feeding outputs use the confirmed mapping; all cable quantities are illustrative.
# Reusable switchgear definition: stations select switchgear_type and optional cable_overrides.
# Branch preprocessing input: run gridPreprocess before using the generated grid in dcStudy.
# SS0 uses explicit switchgear wiring; the other five stations keep the legacy model.
# The added conductor resistances are SYNTHETIC verification values, not manufacturer data.
# SS0 uses reversed N/S orientation through -SS0; left/right branch order is preserved.
dcsim {
  grid = {
    u_nominal_V = 3000
    u_min_V = 2000
    u_cutoff_V = 2400
    u_max_V = 3600
    i_train_max_A = 1500
    p_train_max_W = 10000000
    p_allow_W = 3600000
    reference_node_id = "SS0.N"
    substationTypes = {
      standard = {
        emf_V = 3120.0
        internal_resistance_ohm = 0.08
        rectifier_type = "DIODE"
        enabled = true
        terminal_model = "SIX_TERMINAL_RECTIFIER"
      }
    }
    conductorTypes {
      cable1000 { resistance_ohm_per_km = 0.02 }
      cable500  { resistance_ohm_per_km = 0.04 }
      cable240  { resistance_ohm_per_km = 0.08 }
    }
    lineTypes = {
      standard = {
        feeding_resistance_ohm_per_m = 1.5e-05
        return_resistance_ohm_per_m = 1.5e-05
      }
    }
    switchgearTypes {
      branch_j1 {
        model = BRANCH_GAP
        branch_terminals {
          "101" { N="1", S="2" }
          "200" { N="3", S="4" }
          "201" { N="5", S="6" }
        }
        busbars { PBB1=FEEDING, PBB2=FEEDING, PBB3=FEEDING, PBB4=FEEDING, PBB5=FEEDING, PBB6=FEEDING, NBB=RETURN }
        connections = [
          { id=FC1, from=POS, to=PBB1, length_m=100, conductor_type=cable1000, multiplicity=2 },
          { id=FP1, from=PBB1, to="1", length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=FC2, from=POS, to=PBB2, length_m=100, conductor_type=cable1000, multiplicity=2 },
          { id=FP2, from=PBB2, to="2", length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=FC3, from=POS, to=PBB3, length_m=100, conductor_type=cable1000, multiplicity=2 },
          { id=FP3, from=PBB3, to="3", length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=FC4, from=POS, to=PBB4, length_m=100, conductor_type=cable1000, multiplicity=2 },
          { id=FP4, from=PBB4, to="4", length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=FC5, from=POS, to=PBB5, length_m=100, conductor_type=cable1000, multiplicity=2 },
          { id=FP5, from=PBB5, to="5", length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=FC6, from=POS, to=PBB6, length_m=100, conductor_type=cable1000, multiplicity=2 },
          { id=FP6, from=PBB6, to="6", length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=RC0, from=NEG, to=NBB, length_m=100, conductor_type=cable500, multiplicity=8 },
          { id=RP_101_N, from=NBB, to=R_101_N, length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=RP_101_S, from=NBB, to=R_101_S, length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=RP_200_N, from=NBB, to=R_200_N, length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=RP_200_S, from=NBB, to=R_200_S, length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=RP_201_N, from=NBB, to=R_201_N, length_m=15, conductor_type=cable240, multiplicity=6 },
          { id=RP_201_S, from=NBB, to=R_201_S, length_m=15, conductor_type=cable240, multiplicity=6 }
        ]
      }
      # Same illustrative cables as standard_gap; only rail continuity changes.
      standard_no_gap = ${dcsim.grid.switchgearTypes.standard_gap}
      standard_no_gap.model = DOUBLE_TRACK_NO_GAP
      standard_gap = {
      model = DOUBLE_TRACK_GAP
      # Default customer IDs: 1=left N, 2=left S, 3=right N, 4=right S.
      # POS/NEG are rectifier poles, not additional voltage sources.
      busbars { PBB1 = FEEDING, PBB2 = FEEDING, PBB3 = FEEDING, PBB4 = FEEDING, NBB = RETURN }
      connections = [
        { id=FC1, from=POS, to=PBB1, length_m=100, conductor_type=cable1000, multiplicity=2 },
        { id=FC2, from=POS, to=PBB2, length_m=100, conductor_type=cable1000, multiplicity=2 },
        { id=FC3, from=POS, to=PBB3, length_m=100, conductor_type=cable1000, multiplicity=2 },
        { id=FC4, from=POS, to=PBB4, length_m=100, conductor_type=cable1000, multiplicity=2 },
        { id=RC0, from=NEG, to=NBB,  length_m=100, conductor_type=cable500,  multiplicity=8 },
        { id=FP1, from=PBB1, to="1", length_m=15, conductor_type=cable240, multiplicity=6 },
        { id=FP2, from=PBB2, to="2", length_m=15, conductor_type=cable240, multiplicity=6 },
        { id=FP3, from=PBB3, to="3", length_m=25, conductor_type=cable240, multiplicity=4 },
        { id=FP4, from=PBB4, to="4", length_m=15, conductor_type=cable240, multiplicity=4 },
        { id=RP1, from=NBB, to=R1, length_m=15, conductor_type=cable240, multiplicity=6 },
        { id=RP2, from=NBB, to=R2, length_m=15, conductor_type=cable240, multiplicity=6 }
      ]
    }
    }
    electricalObjects = {
      P1 = { kind = "POINT", positions = { N = "101 12+400 N", S = "101 12+400 S" } }
      P2 = { kind = "POINT", positions = { N = "102 48+100 N", S = "102 48+100 S" } }
      P3 = { kind = "POINT", positions = { N = "201 7+850 N", S = "201 7+850 S" } }
      P4 = { kind = "POINT", positions = { N = "202 30+050 N", S = "202 30+050 S" } }
      J1 = { kind = "JUNCTION", positions = { "101" = { N = "101 18+750 N", S = "101 18+750 S" }, "200" = { N = "200 0+000 N", S = "200 0+000 S" }, "201" = { N = "201 14+000 N", S = "201 14+000 S" } } }
      J2 = { kind = "JUNCTION", positions = { "200" = { N = "200 6+200 N", S = "200 6+200 S" }, "102" = { N = "102 41+300 N", S = "102 41+300 S" }, "202" = { N = "202 23+600 N", S = "202 23+600 S" } } }
      SS0 = { kind = "SUBSTATION", type = "standard", switchgear_type = "standard_gap", positions = { N = "101 14+000 N", S = "101 14+000 S" } }
      SS1 = { kind = "SUBSTATION", type = "standard", junction = "J1", switchgear_type = "branch_j1", positions = { N = "101 18+750 N", S = "101 18+750 S" } }
      SS2 = { kind = "SUBSTATION", type = "standard", positions = { N = "200 1+500 N", S = "200 1+500 S" } }
      SS3 = { kind = "SUBSTATION", type = "standard", positions = { N = "200 4+500 N", S = "200 4+500 S" } }
      SS4 = { kind = "SUBSTATION", type = "standard", positions = { N = "102 42+800 N", S = "102 42+800 S" } }
      SS5 = { kind = "SUBSTATION", type = "standard", switchgear_type = "standard_no_gap", positions = { N = "102 45+800 N", S = "102 45+800 S" } }
    }
    # Branch names identify the section whose positions are used.
    # Lines use lineTypes.standard; junction connections are generated.
    branches {
      "101" = [P1, "-SS0", J1]
      "200" = [J1, SS2, SS3, J2]
      "102" = [J2, SS4, SS5, P2]
      "201" = [P3, J1]
      "202" = [J2, P4]
    }
    # '-' reverses the object order of that branch; it does not swap tracks.
    routeDefinitions {
      WE   { branches = ["101", "200", "102"], track = N }
      EW   { branches = ["-102", "-200", "-101"], track = S }
      NwSe { branches = ["201", "200", "202"], track = N }
      SeNw { branches = ["-202", "-200", "-201"], track = S }
    }

  }
}
