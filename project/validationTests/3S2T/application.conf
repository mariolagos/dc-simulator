# =========================
#  DcSim scenario: 3S2T
#  - 3 stations
#  - 2 trains
#  - shared T1 profile, staggered departures
# =========================

study {
  id = "3S2T"
  name = "3 substations, 2 trains"
  description = "Brake receptivity validation"
}

dcsim {

  exportInputs   = "validationTests/3S2T"
  exportTrainId  = "T1"
  exportRunExcel = "project/validationTests/templates/T1/A-B.xlsx"
  export.enabled = false

  simulationControl {
    tickDurationSec = 1.0
    simulationStart = "00:00:00"
    simulationEnd   = "00:02:00"
    simulationSpeed = "FAST"
    stopAfterSteps  = 10
  }

  export {
    csvEveryNthStep = 1
    exportResolution_s = 1
  }


  track {
    stations = [
      { name = "A", position_rwy = "1 0+000" },
      { name = "B", position_rwy = "1 3+000" }
    ]

    kilometer_boards = [
      { section = "1", km = "0+000", length = 3000 },
      { section = "1", km = "3+000", length = 0 }
    ]
  }

  grid {
    groundNodeId = "GND"

    u_nominal_V = 750
    u_min_V = 500
    u_cutoff_V = 600
    u_max_V = 900
    i_train_max_A = 6000
    p_train_max_W = 10000000
    p_allow_W = 3600000

    nodes = [
      { node_id = "GND",    position_rwy = "1 0+100" },

      { node_id = "F1",     position_rwy = "1 0+000" },
      { node_id = "F2",     position_rwy = "1 1+500" },
      { node_id = "F3",     position_rwy = "1 3+000" },

      { node_id = "R1",     position_rwy = "1 0+000" },
      { node_id = "R2",     position_rwy = "1 1+500" },
      { node_id = "R3",     position_rwy = "1 3+000" },

      { node_id = "ANCHOR", position_rwy = "1 3+000" }
    ]

    lines = [
      { node_from_id = "F1", node_to_id = "F2", lengthM = 1500, resistance_ohm_per_m = 0.00003 },
      { node_from_id = "F2", node_to_id = "F3", lengthM = 1500, resistance_ohm_per_m = 0.00003 },

      { node_from_id = "R1", node_to_id = "R2", lengthM = 1500, resistance_ohm_per_m = 0.00003 },
      { node_from_id = "R2", node_to_id = "R3", lengthM = 1500, resistance_ohm_per_m = 0.00003 }
    ]

    power_installations = [
      {
        installation_id = "SS0"
        installation_type = "SUBSTATION"
        emf_V = 750.0
        internal_resistance_ohm = 0.01
        rectifier_type = "DIODE"
      },
      {
        installation_id = "SS1"
        installation_type = "SUBSTATION"
        emf_V = 750.0
        internal_resistance_ohm = 0.01
        rectifier_type = "DIODE"
      },
      {
        installation_id = "SS2"
        installation_type = "SUBSTATION"
        emf_V = 750.0
        internal_resistance_ohm = 0.01
        rectifier_type = "DIODE"
      }
    ]

    installation_connections = [
      { installation_id = "SS0", node_id = "F1", connection_type = "FEEDING" },
      { installation_id = "SS0", node_id = "R1", connection_type = "RETURN" },

      { installation_id = "SS1", node_id = "F2", connection_type = "FEEDING" },
      { installation_id = "SS1", node_id = "R2", connection_type = "RETURN" },

      { installation_id = "SS2", node_id = "F3", connection_type = "FEEDING" },
      { installation_id = "SS2", node_id = "R3", connection_type = "RETURN" }
    ]

    anchorNodeId = "ANCHOR"
  }

  trains {
    defaults {
      maxVoltage    = 900.0
      minVoltage    = 500.0
      cutoffVoltage = 600.0
      maxCurrentA   = 6000.0
    }
  }

  electrics.substations.defaults {
    allowBackfeed = false
    maxCurrentA   = 0.0
  }

  traffic {
    timetable {
      trains = [
        { id = "Train1", templateId = "T1", departure = "00:00:00", count = 1, sectionId = "1", trackId = "u" },
        { id = "Train2", templateId = "T1", departure = "00:00:50", count = 1, sectionId = "1", trackId = "u" }
      ]
    }

    templates = {
        run_excel = "T1/A-B.xlsx"
        motoring_and_auxiliaries_in_same_model = false
        auxiliary_power_W = 0

      T1 = {
        stops = [
          { signature = "A", departure = "00:00:00" },
          { signature = "B", arrival   = "00:02:00" }
        ]
      }
    }
  }

  powerProfiles {
    motoringAndAuxiliariesInSameModel = false
    auxiliaryPower = 0

    templates = [
      {
        id     = "T1"
        folder = "d:/tools/dc-simulator/project/validationTests/templates/T1"
        legs = [
          { fromStation = "A", toStation = "B", file = "A-B.xlsx" }
        ]
      }
    ]
  }

  train {
    vMS     = 25.0
    pW      = 0.0
    Rmin    = 5e-6
    epsFrac = 1e-4
  }

  verbose {
    all = true
  }

  projects.root = "project"
  run.project   = "3S2T"
  run.scenario  = "scenario1"

  dcsim.paths {
    longtable  = "${dcsim.projects.root}/${dcsim.run.project}/${dcsim.run.scenario}/longtable.csv"
    pivots_dir = "${dcsim.projects.root}/${dcsim.run.project}/${dcsim.run.scenario}/pivots"
  }
}

grid = ${dcsim.grid}