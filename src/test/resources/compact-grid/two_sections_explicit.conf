study {
  id = "two_sections"
  name = "Two-section check"
  description = "Section 101 is traversed in decreasing railway coordinates; section 102 is traversed in increasing railway coordinates."
}

report.graphical-timetable {
  enabled = true

  base-route {
    id = "AD"
    sections = ["101", "102"]
  }
}

dcsim {
  simulationControl {
    tickDurationSec = 1.0
    simulationStart = "00:00:00"
    simulationEnd = "00:30:00"
    simulationSpeed = "FAST"
  }

